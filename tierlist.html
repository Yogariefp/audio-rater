<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEM Tier List</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --accent: #7c6af7;
    --accent2: #5eead4;
    --text: #e2e8f0;
    --muted: #8892a4;
    --border: #2d3348;
    --red: #f87171;
    --yellow: #fbbf24;
    --green: #34d399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 1.9rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--muted);
    font-size: 0.88rem;
    margin-top: 6px;
  }

  header a { color: var(--accent2); text-decoration: none; }
  header a:hover { text-decoration: underline; }

  .mode-toggle {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }

  .mode-btn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }

  .mode-btn.active {
    background: var(--accent);
    color: #0f1117;
    border-color: var(--accent);
  }

  .bar-value-row { transition: opacity 0.2s; }
  body.mode-noValue .bar-value-row { opacity: 0.3; }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 0.9rem;
  }

  .tier {
    display: grid;
    grid-template-columns: 72px 1fr;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .tier-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    color: #0f1117;
  }

  .tier-body {
    background: var(--surface);
  }

  .tier-empty {
    padding: 16px 18px;
    color: var(--muted);
    font-size: 0.82rem;
    font-style: italic;
  }

  .tier-row {
    display: grid;
    grid-template-columns: 32px 1fr auto 160px;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }

  .tier-row:first-child { border-top: none; }

  .tier-rank {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
  }

  .tier-name-wrap { min-width: 0; }

  .tier-name {
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tier-meta {
    color: var(--muted);
    font-size: 0.76rem;
    margin-top: 2px;
  }

  .tier-score {
    font-weight: 700;
    font-size: 1.1rem;
    min-width: 44px;
    text-align: right;
  }

  .tier-bars {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .tier-bar-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tier-bar-label {
    font-size: 0.62rem;
    color: var(--muted);
    width: 34px;
    flex-shrink: 0;
  }

  .tier-bar-track {
    flex: 1;
    height: 5px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .tier-bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  @media (max-width: 620px) {
    .tier-bars { display: none; }
    .tier-row { grid-template-columns: 28px 1fr auto; }
  }
</style>
</head>
<body>

<header>
  <h1>🏆 IEM Tier List</h1>
  <p>Auto-ranked from your saved ratings, grouped by overall score</p>
  <p><a href="iem-audio-rater.html">&larr; Back to Rater</a> &nbsp;·&nbsp; <a href="eartips-tierlist.html">Eartips Tier List &rarr;</a></p>
  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-btn-withValue" onclick="setMode('withValue')">Overall (incl. Value)</button>
    <button class="mode-btn" id="mode-btn-noValue" onclick="setMode('noValue')">Sound Only (excl. Value)</button>
  </div>
</header>

<div class="wrap" id="content">
  <div class="empty-state">Loading ratings&hellip;</div>
</div>

<script>
  const TIERS = [
    { key: 'S', label: 'S', min: 8.5, color: '#34d399' },
    { key: 'A', label: 'A', min: 7.0, color: '#5eead4' },
    { key: 'B', label: 'B', min: 5.5, color: '#fbbf24' },
    { key: 'C', label: 'C', min: 4.0, color: '#f97316' },
    { key: 'F', label: 'F', min: -Infinity, color: '#f87171' }
  ];

  function tierOf(score) {
    return TIERS.find(t => score >= t.min);
  }

  function scoreColor(score) {
    if (score >= 8.5) return '#34d399';
    if (score >= 7)   return '#5eead4';
    if (score >= 5.5) return '#fbbf24';
    if (score >= 4)   return '#f97316';
    return '#f87171';
  }

  const GROUPS = {
    Bass:   { ids: ['subbass','basshit','bassclarity'], color: '#7c6af7' },
    Mids:   { ids: ['vocals','instruments','midwarmth'], color: '#a78bfa' },
    Treble: { ids: ['detail','sibilance','air'], color: '#5eead4', invert: 'sibilance' },
    Tech:   { ids: ['separation','soundstage','imaging'], color: '#34d399' },
    Fit:    { ids: ['comfort','isolation','build'], color: '#fbbf24' },
    Value:  { ids: ['value'], color: '#f87171' }
  };

  // Weights mirror iem-audio-rater.html's formula (sum 7.0 with Value, 6.4 without).
  const WEIGHTS = { Bass: 1.5, Mids: 1.5, Treble: 1.2, Tech: 1.2, Fit: 1.0, Value: 0.6 };

  function groupAvg(scores, def) {
    const vals = def.ids.map(id => {
      const v = scores[id] ?? 5;
      return id === def.invert ? 11 - v : v;
    });
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }

  // Always recomputed from raw scores (not the stored `overall`/`overallNoValue`
  // fields) so both modes work consistently even for entries saved before this
  // feature existed.
  function computeOverall(scores) {
    const g = {};
    Object.entries(GROUPS).forEach(([label, def]) => { g[label] = groupAvg(scores || {}, def); });
    const withValueWeight = Object.values(WEIGHTS).reduce((a, b) => a + b, 0); // 7.0
    const noValueWeight = withValueWeight - WEIGHTS.Value;                     // 6.4
    let withValueSum = 0, noValueSum = 0;
    Object.entries(WEIGHTS).forEach(([label, w]) => {
      withValueSum += g[label] * w;
      if (label !== 'Value') noValueSum += g[label] * w;
    });
    return {
      withValue: Math.round((withValueSum / withValueWeight) * 10) / 10,
      noValue:   Math.round((noValueSum / noValueWeight) * 10) / 10
    };
  }

  let mode = 'withValue';

  function setMode(m) {
    mode = m;
    document.getElementById('mode-btn-withValue').classList.toggle('active', m === 'withValue');
    document.getElementById('mode-btn-noValue').classList.toggle('active', m === 'noValue');
    document.body.classList.toggle('mode-noValue', m === 'noValue');
    renderList();
  }

  function escHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function loadLocalHistory() {
    try { return JSON.parse(localStorage.getItem('iem_ratings') || '[]'); }
    catch { return []; }
  }

  async function loadAllRatings() {
    const local = loadLocalHistory();
    let bundled = [];
    try {
      const res = await fetch('iem-ratings.json');
      if (res.ok) bundled = await res.json();
    } catch (_) { /* offline or file absent */ }

    const byId = new Map();
    [...bundled, ...local].forEach(item => {
      if (item && item.name) byId.set(item.id ?? item.name, item);
    });
    return [...byId.values()];
  }

  function renderBars(item) {
    return Object.entries(GROUPS).map(([label, def]) => {
      const avg = groupAvg(item.scores || {}, def);
      const pct = ((avg - 1) / 9 * 100).toFixed(0);
      const rowClass = label === 'Value' ? 'tier-bar-row bar-value-row' : 'tier-bar-row';
      return `
        <div class="${rowClass}">
          <span class="tier-bar-label">${label}</span>
          <div class="tier-bar-track">
            <div class="tier-bar-fill" style="width:${pct}%; background:${def.color};"></div>
          </div>
        </div>`;
    }).join('');
  }

  let allRatings = [];

  function renderList() {
    const content = document.getElementById('content');

    if (!allRatings.length) {
      content.innerHTML = '<div class="empty-state">No ratings yet. Go rate some IEMs first!</div>';
      return;
    }

    const scored = allRatings.map(item => ({
      item,
      score: computeOverall(item.scores)[mode]
    }));

    scored.sort((a, b) => b.score - a.score);

    const grouped = new Map(TIERS.map(t => [t.key, []]));
    scored.forEach(row => grouped.get(tierOf(row.score).key).push(row));

    content.innerHTML = TIERS.map(t => {
      const rows = grouped.get(t.key);
      const body = rows.length
        ? rows.map((row, i) => {
            const item = row.item;
            const driver = item.driver ? ` · ${escHtml(item.driver)}` : '';
            const price = item.price ? ` · ${escHtml(item.price)}` : '';
            return `
              <div class="tier-row">
                <div class="tier-rank">#${i + 1}</div>
                <div class="tier-name-wrap">
                  <div class="tier-name">${escHtml(item.name)}</div>
                  <div class="tier-meta">${driver}${price}</div>
                </div>
                <div class="tier-score" style="color:${scoreColor(row.score)}">${row.score.toFixed(1)}</div>
                <div class="tier-bars">${renderBars(item)}</div>
              </div>`;
          }).join('')
        : '<div class="tier-empty">No IEMs in this tier yet.</div>';

      return `
        <div class="tier">
          <div class="tier-badge" style="background:${t.color};">${t.label}</div>
          <div class="tier-body">${body}</div>
        </div>`;
    }).join('');
  }

  async function render() {
    allRatings = await loadAllRatings();
    renderList();
  }

  render();
</script>
</body>
</html>
